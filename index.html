<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0908" />
    <title>ДВИЖ ДОНБАСС — Terikon Culture</title>
    <meta
      name="description"
      content="Движ Донбасс — культурное движение: музыка, свобода, единство, улица. Это не сайт. Это ощущение."
    />

    <!-- Preconnect to font origins for faster first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Логотип первого экрана грузится в первую очередь -->
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%images/brand/logo.webp" />

    <!-- Open Graph / social preview -->
    <meta property="og:title" content="ДВИЖ ДОНБАСС" />
    <meta property="og:description" content="Музыка, свобода, единство, улица. Движ Донбасс — культурное движение." />
    <meta property="og:image" content="%BASE_URL%images/brand/logo-mark-512.png" />
    <meta property="og:type" content="website" />

    <!-- Favicon из логотипа движения. Префикс базового пути Vite подставляет сам (нужно для GitHub Pages) -->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
  </head>
  <body class="bg-black text-bone antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
