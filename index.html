<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0908" />
    <title>ДВИЖ ДОНБАСС — Terikon Culture</title>
    <meta
      name="description"
      content="Движ Донбасс — культурное движение: музыка, свобода, единство, улица. Это не сайт. Это ощущение."
    />

    <!-- Preconnect to font origins for faster first paint -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Логотип первого экрана грузится в первую очередь -->
    <link rel="preload" as="image" type="image/webp" href="%BASE_URL%images/brand/logo.webp" />

    <!-- Превью ссылки в Telegram, WhatsApp, VK и соцсетях.
         Нужны ПОЛНЫЕ адреса — с относительными мессенджеры картинку не показывают. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Движ Донбасс" />
    <meta property="og:title" content="ДВИЖ ДОНБАСС — Terikon Culture" />
    <meta property="og:description" content="Карта сходок, музыка, фото и видео движа. Где ты — там и движ." />
    <meta property="og:url" content="https://dvizhdonbas.github.io/" />
    <meta property="og:image" content="https://dvizhdonbas.github.io/images/brand/og-cover.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://dvizhdonbas.github.io/images/brand/og-cover.jpg" />

    <!-- Favicon из логотипа движения. Префикс базового пути Vite подставляет сам (нужно для GitHub Pages) -->
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
  </head>
  <body class="bg-black text-bone antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
